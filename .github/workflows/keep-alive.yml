name: keep-alive
# 이틀에 한 번 Supabase에 접속해서, 무료 프로젝트가 일시 정지되지 않게 합니다.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://lzjuejmfhenxckowogqu.supabase.co
          ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $ANON_KEY"
          echo "Supabase ping ok"

